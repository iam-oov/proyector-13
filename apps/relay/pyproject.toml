[project]
name = "proyector-relay"
version = "0.1.0"
description = "Relay behind valdoh.com/proyector: the PWA reaches the projectors through it"
requires-python = ">=3.15"
dependencies = ["aiohttp>=3.14"]

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
